version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cinematica-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cinematica-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinematica-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cinematica
      - JWT_SECRET=cinematica_jwt_secret_key_super_secure_2026
      - JWT_EXPIRE=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - cinematica-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinematica-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cinematica-network

volumes:
  mongo-data:

networks:
  cinematica-network:
    name: cinematica-network
